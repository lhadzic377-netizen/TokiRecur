name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/ tests/

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          - os: macos-14
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Smoke import
        run: python -c "import tokirecur; print('ok')"
      - name: Run unit tests
        run: pytest tests/unit/ -q

  installer-linux:
    name: Installer (Linux systemd)
    runs-on: ubuntu-latest
    steps:
      # The exact one-liner from the README: fetch install.sh from the
      # private repo with the Actions token (repo-scoped Contents:read)
      # and pipe it into a root shell. Retries guard against GitHub's raw
      # CDN lagging behind a fresh push (stale or briefly-404 content).
      - name: One-liner install (curl | sudo bash)
        env:
          INSTALL_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:$INSTALL_TOKEN@raw.githubusercontent.com/lhadzic377-netizen/TokiRecur/master/install.sh"
          for i in $(seq 1 20); do
            curl -fsSL "$URL" 2>/dev/null | grep -q "bootstrap installer" && break
            sleep 10
          done
          TOKI_INSTALL_TOKEN="$INSTALL_TOKEN" curl -fsSL "$URL" | sudo TOKI_INSTALL_TOKEN="$INSTALL_TOKEN" bash
      - name: Verify artifacts
        run: |
          set -e
          id toki
          /usr/local/bin/toki --version
          test -f /opt/toki-recur/venv/bin/toki
          test -f /etc/systemd/system/toki-recur.service
          test -f /etc/toki-recur/toki.env
          test -f /etc/logrotate.d/toki-recur
          systemctl is-enabled toki-recur.service
          test -x /var/lib/toki-recur/.local/state/tokirecur/bin/llama-server
          /var/lib/toki-recur/.local/state/tokirecur/bin/llama-server --version
      - name: Start the daemon via systemd
        run: |
          set -e
          sudo systemctl start toki-recur.service
          sleep 3
          systemctl is-active toki-recur.service
          journalctl -u toki-recur.service --no-pager -n 20
      - name: Stop + disable (leave runner clean)
        run: sudo systemctl stop toki-recur.service && sudo systemctl disable toki-recur.service

  installer-macos:
    name: Installer (macOS launchd)
    runs-on: macos-14
    steps:
      - name: One-liner install (curl | sudo bash)
        env:
          INSTALL_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:$INSTALL_TOKEN@raw.githubusercontent.com/lhadzic377-netizen/TokiRecur/master/install.sh"
          for i in $(seq 1 20); do
            curl -fsSL "$URL" 2>/dev/null | grep -q "bootstrap installer" && break
            sleep 10
          done
          TOKI_INSTALL_TOKEN="$INSTALL_TOKEN" curl -fsSL "$URL" | sudo TOKI_INSTALL_TOKEN="$INSTALL_TOKEN" bash
      - name: Verify artifacts
        run: |
          set -e
          id toki
          /usr/local/bin/toki --version
          test -f /opt/toki-recur/venv/bin/toki
          test -f /Library/LaunchDaemons/com.tokirecur.plist
          test -f /etc/toki-recur/toki.env
          test -f /etc/toki-recur/toki-serve.sh
          test -x /var/lib/toki-recur/.local/state/tokirecur/bin/llama-server
          /var/lib/toki-recur/.local/state/tokirecur/bin/llama-server --version
          launchctl print system/com.tokirecur | head -3
      - name: Unload (leave runner clean)
        run: sudo launchctl bootout system/com.tokirecur || true

  installer-windows:
    name: Installer (Windows)
    runs-on: windows-latest
    steps:
      # The exact one-liner from the README, in PowerShell: WebClient
      # DownloadString (URL basic-auth works across PS 5.1 and 7) piped
      # into iex. Retries guard against GitHub's raw CDN lagging behind
      # a fresh push (stale or briefly-404 content).
      - name: One-liner install (WebClient | iex)
        env:
          INSTALL_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $url = "https://x-access-token:$env:INSTALL_TOKEN@raw.githubusercontent.com/lhadzic377-netizen/TokiRecur/master/install.ps1"
          $script = $null
          foreach ($i in 1..20) {
            try {
              $s = (New-Object System.Net.WebClient).DownloadString($url)
              if ($s -match 'bootstrap installer') { $script = $s; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $script) { throw "one-liner fetch failed (raw CDN not propagated)" }
          $env:TOKI_INSTALL_TOKEN = "$env:INSTALL_TOKEN"
          iex $script
      - name: Verify artifacts
        shell: pwsh
        run: |
          $toki = Join-Path $env:LOCALAPPDATA 'tokirecur\venv\Scripts\toki.exe'
          Test-Path $toki
          & $toki --version
          $bin = Join-Path $env:USERPROFILE '.local\state\tokirecur\bin\llama-server.exe'
          Test-Path $bin
          & $bin --version

  install-llama:
    name: install-llama (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e .
      - name: Fetch llama-server binary for this OS/arch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: toki model install-llama
      - name: Verify binary runs
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$HOME/.local/state/tokirecur/bin/llama-server.exe"
          else
            BIN="$HOME/.local/state/tokirecur/bin/llama-server"
          fi
          test -f "$BIN"
          "$BIN" --version
      - name: Service manager refusal on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          OUT=$(toki service install 2>&1)
          RC=$?
          set -e
          test "$RC" -ne 0
          echo "$OUT" | grep -qi "systemd"

  wheel:
    name: Build universal wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Assert platform-agnostic wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "wheel: $WHEEL"
          case "$WHEEL" in
            *any.whl) echo "ok: platform-agnostic" ;;
            *) echo "error: platform-specific wheel" >&2; exit 1 ;;
          esac
      - name: Install wheel in clean venv and smoke test
        run: |
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/pip install "$(ls dist/*.whl)"
          /tmp/wheelvenv/bin/pip install pytest pytest-asyncio
          /tmp/wheelvenv/bin/python -c "import tokirecur; print('ok')"
          /tmp/wheelvenv/bin/pytest -q tests/unit/test_tree_cache_wiring.py