version: "3.9"

services:
  llama-server:
    image: tokirecur-rocm:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${HIP_ARCH_OVERRIDE:-11.0.0}
      - HIP_ARCH=gfx1151
      - GGML_HIP_UMA=ON
    volumes:
      - ${MODEL_PATH:-/home/lukehadzic/Downloads/Qwen3.5-9B-Q4_K_M.gguf}:/models/model.gguf:ro
      - tr-cache:/var/lib/tokirecur
    command: >
      llama-server
      -m /models/model.gguf
      --host 0.0.0.0 --port 8080
      -c 8192 -ngl 99
      --parallel 4
    ports:
      - "8080:8080"

  tokirecurd:
    image: tokirecur-rocm:latest
    depends_on:
      - llama-server
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    environment:
      - TR_BACKEND_URL=http://llama-server:8080
    volumes:
      - tr-cache:/var/lib/tokirecur
    command: tokirecur serve --host 0.0.0.0 --port 8787
    ports:
      - "8787:8787"

volumes:
  tr-cache:
