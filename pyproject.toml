[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokirecur"
version = "0.1.0"
description = "Toki Recur — KV cache reuse for LLM inference. Drop-in prefix caching across CUDA, ROCm, and Vulkan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Toki Recur" }]
keywords = ["llm", "inference", "kv-cache", "prefix-cache", "rocm", "llama.cpp", "toki-recur"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "rich>=13.7",
    "click>=8.1",
    "prometheus-client>=0.19",
    "textual>=0.85",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "pyfiglet>=0.8",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6", "torch>=2.2"]
index = ["hnswlib>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "ruff>=0.4", "build>=1.0"]

[project.scripts]
toki = "tokirecur.cli:main"
tokirecur = "tokirecur.cli:main"
tokirecur-bench = "tokirecur.bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tokirecur" = ["py.typed", "bench/corpus/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# bench/cli.py is heavy on long prompt strings (user-facing workload text)
# and table-rendering code. The strings are intentional and rewrapping
# them risks altering prompt semantics.
"src/tokirecur/bench/cli.py" = ["E501"]
# cli/__init__.py and cli/completions.py contain click help/epilog strings
# that read better as one line each.
"src/tokirecur/cli/__init__.py" = ["E501"]
"src/tokirecur/cli/completions.py" = ["E501"]
# ctl/__init__.py embeds provider-config dicts whose keys are intentionally
# long (OpenClaw/OpenCode schema field names).
"src/tokirecur/ctl/__init__.py" = ["E501"]
# Tests frequently embed long fixture strings (realistic JSON, SSE
# payloads, chat histories). Wrapping them would obscure intent.
"tests/**/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
